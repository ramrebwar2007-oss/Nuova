  </defs>
  <text x="400" y="118" text-anchor="middle" font-family="Bodoni MT, Didot, 'Times New Roman', Georgia, serif" font-size="144" font-weight="400" letter-spacing="14" fill="url(#word)">NUOVA</text>
  <path d="M 130 144 C 245 162 330 132 420 140 C 515 148 600 136 670 142" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">NUOVA — Men's Luxury Wear</title>
  <desc id="desc">NUOVA luxury fashion wordmark with a flowing signature line.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2118"/>
      <stop offset=".28" stop-color="#80583D"/>
      <stop offset=".55" stop-color="#B68B65"/>
      <stop offset=".78" stop-color="#573521"/>
      <stop offset="1" stop-color="#9A704F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">

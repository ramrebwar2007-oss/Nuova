  <text x="400" y="192" text-anchor="middle" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="9" fill="#4A2B1D">MEN’S LUXURY WEAR</text>
